name: CI

# CI sur le Gitea interne (git.prunus.dev, runner LXC 111). GitHub n'est qu'une sauvegarde : pas de CI là-bas.
on:
  push:
    branches: [main]
    # Jamais sur une étiquette (Gitea lancerait sinon la CI de chaque étiquette poussée)
    tags-ignore: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  # Le groupe est partagé entre dépôts sur Gitea : le nom du dépôt y figure
  group: ci-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Seuil minimal de couverture des lignes PHP (%) : la CI échoue s'il baisse
  COVERAGE_MIN: 0

jobs:
  js-unit:
    name: JavaScript (syntax, PWA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm run lint
      - name: Tests unitaires et couverture
        run: npm run test:coverage 2>&1 | tee coverage.txt
      - name: Résumé de la couverture
        if: always()
        run: |
          { echo '### Couverture du code JavaScript'; echo '```'; cat coverage.txt 2>/dev/null; echo '```'; } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"

  php-quality:
    name: PHP 8.5 (PSR-12, static analysis, unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring
          tools: composer
          coverage: pcov
      - name: Syntax check of every PHP file
        run: |
          find src server web tests -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Coding standard (PSR-12)
        run: composer cs
      - name: Static analysis (PHPStan, level 8)
        run: composer stan
      - name: Unit tests and coverage
        run: vendor/bin/phpunit --colors=never --coverage-text 2>&1 | tee php-coverage.txt
      - name: Résumé et seuil de couverture PHP
        run: |
          { echo '### Couverture du code PHP'; echo '```'; grep -A6 'Code Coverage Report' php-coverage.txt; echo '```'; } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          pct=$(grep -E '^\s+Lines:' php-coverage.txt | head -1 | sed -E 's/.*Lines:\s+([0-9.]+)%.*/\1/')
          test -n "$pct" || { echo 'taux de couverture introuvable'; exit 1; }
          echo "Couverture des lignes PHP : ${pct} % (minimum ${COVERAGE_MIN} %)"
          awk -v p="$pct" -v m="$COVERAGE_MIN" 'BEGIN{exit !(p+0 >= m+0)}'

  integration:
    name: Game server (integration tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring
          tools: composer
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress --no-dev
      - name: Start the real PHP WebSocket server and play against it
        run: npm run test:integration

  docker:
    name: Docker image (smoke test)
    runs-on: ubuntu-latest
    env:
      # Le démon Docker est celui de l'hôte, partagé entre les tâches : noms uniques par exécution, les conteneurs testés
      # partagent le réseau de la tâche (--network container:...) et les données vivent dans un volume Docker (pas de
      # dossier de l'hôte ni de port publié, donc rien qui entre en collision).
      IMAGE: bramblekin:ci-${{ github.run_id }}
      NAME: bramblekin-${{ github.run_id }}
      VOL: bramblekin-data-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
      - name: Outil dv (commande dans le volume de données, en root)
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/bin/sh\nexec docker run --rm -i -v "%s:/d" --user 0 "%s" "$@"\n' "$VOL" "$IMAGE" > "$RUNNER_TEMP/bin/dv"
          chmod +x "$RUNNER_TEMP/bin/dv"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Build the image
        run: docker build -t "$IMAGE" .
      - name: Start the website and the game server with a bind-mounted data directory (as in production)
        run: |
          docker volume create "$VOL" > /dev/null
          dv chown 33:33 /d
          docker run -d --name "$NAME-web" --network "container:$(hostname)" -v "$VOL:/var/www/html/data" \
            -e BRAMBLE_WS=wss://example.test/ws "$IMAGE"
          docker run -d --name "$NAME-ws" --network "container:$(hostname)" --user 33:33 -v "$VOL:/var/www/html/data" \
            -e WS_ALLOWED_ORIGINS=https://example.test "$IMAGE" php /opt/bramblekin/server.php
          for i in $(seq 1 30); do curl -fs http://localhost/ >/dev/null && break; sleep 1; done
      - name: Smoke test
        run: |
          set -eu
          B=http://localhost
          code() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          test "$(code $B/)" = 200
          for f in game.js zones.json content.json vendor/three.module.js; do test "$(code $B/$f)" = 200; done
          for f in manifest.webmanifest sw.js icons/icon-192.png; do test "$(code $B/$f)" = 200; done
          # game saves: empty at first, then written and read back under the token's hash, never served directly
          T=abcdefghijklmnopqrstuvwxyz012345
          test "$(curl -s "$B/save.php?token=$T")" = '{}'
          curl -s -X POST -H 'Content-Type: application/json' -d '{"token":"'$T'","state":{"v":1,"bag":{"Orbe":2}}}' $B/save.php | grep -q savedAt
          curl -s "$B/save.php?token=$T" | grep -q '"Orbe":2'
          test "$(code "$B/save.php?token=bad")" = 400
          test "$(code -X DELETE $B/save.php)" = 405
          test "$(code $B/data/saves/)" = 403
          # a PIN protects a save: without it, the save can be neither read nor overwritten; 5 wrong PINs lock it
          W=defghijklmnopqrstuvwxyz012345678
          curl -s -X POST -H 'Content-Type: application/json' -d '{"token":"'$W'","state":{"v":1,"bag":{"Orbe":3}}}' $B/save.php | grep -q savedAt
          curl -s -X POST -H 'Content-Type: application/json' -d '{"token":"'$W'","newPin":"2468"}' $B/save.php | grep -q '"pin":true'
          test "$(code "$B/save.php?token=$W")" = 401
          curl -s "$B/save.php?token=$W&pin=2468" | grep -q '"Orbe":3'
          test "$(code -X POST -H 'Content-Type: application/json' -d '{"token":"'$W'","state":{"v":1}}' $B/save.php)" = 401
          for i in 1 2 3 4; do test "$(code "$B/save.php?token=$W&pin=1111")" = 401; done
          test "$(code "$B/save.php?token=$W&pin=1111")" = 423
          test "$(code "$B/save.php?token=$W&pin=2468")" = 423
          # players online and chat: a ping counts the player, a general message is seen by all, a private one only by its recipient
          U=bcdefghijklmnopqrstuvwxyz0123456
          V=cdefghijklmnopqrstuvwxyz01234567
          curl -s -X POST -H 'Content-Type: application/json' -d '{"token":"'$U'","name":"Alice"}' $B/online.php | grep -q '"online":1'
          IDV=$(curl -s -X POST -H 'Content-Type: application/json' -d '{"token":"'$V'","name":"Bob"}' $B/online.php | sed 's/.*"me":"\([a-f0-9]*\)".*/\1/')
          test "$(curl -s $B/online.php)" = '{"online":2}'
          curl -s -X POST -H 'Content-Type: application/json' -d '{"token":"'$U'","name":"Alice","text":"Salut"}' $B/chat.php | grep -q '"ok":true'
          test "$(code -X POST -H 'Content-Type: application/json' -d '{"token":"'$U'","name":"Alice","text":"trop vite"}' $B/chat.php)" = 429
          sleep 2
          curl -s -X POST -H 'Content-Type: application/json' -d '{"token":"'$U'","name":"Alice","text":"Psst","to":"'$IDV'"}' $B/chat.php | grep -q '"ok":true'
          curl -s "$B/chat.php?token=$V" | grep -q Psst
          ! curl -s "$B/chat.php?token=$T" | grep -q Psst
          curl -s "$B/chat.php?token=$T" | grep -q Salut
          test "$(code $B/data/chat.json)" = 403
          # nicknames are reserved: Bob cannot post as Alice, nor show up as her in the player list
          test "$(code -X POST -H 'Content-Type: application/json' -d '{"token":"'$V'","name":"alice","text":"Je suis Alice"}' $B/chat.php)" = 409
          curl -s -X POST -H 'Content-Type: application/json' -d '{"token":"'$V'","name":"ALICE"}' $B/online.php | grep -q '"nameTaken":true'
          test "$(code $B/data/names.json)" = 403
          # the old /3d/ preview address redirects to the game
          curl -s $B/3d/ | grep -q 'url=../'
          # the leaderboard API: empty at first, GET only, and it never serves the data directory
          test "$(curl -s $B/api.php)" = '[]'
          test "$(code -X DELETE $B/api.php)" = 405
          test "$(code $B/data/ratings.json)" = 403
          test "$(code $B/data/)" = 403
          # the PHP code (src/, server/, vendor/) lives outside the docroot
          for p in src/Game/GameHub.php server/server.php vendor/autoload.php composer.json; do test "$(code $B/$p)" = 404; done
          # the leaderboard is written by the game server and read by the website, without any token hash
          printf '%s' '{"players":{"secrethash":{"name":"Alice","rating":1020,"played":1,"wins":1,"losses":0}}}' \
            | dv sh -c 'cat > /d/ratings.json'
          dv chmod 644 /d/ratings.json
          curl -s $B/api.php | grep -q '"rating":1020'
          ! curl -s $B/api.php | grep -q secrethash
          # player saves are never served
          test "$(code $B/data/players/)" = 403
          # the game server is up, shares the data directory as www-data, and enforces its origin list
          docker logs "$NAME-ws" | grep -q 'listening'
          ! docker logs "$NAME-ws" | grep -q WARNING
          docker logs "$NAME-ws" | grep -q '60 maps'
          H='Connection: Upgrade'; U='Upgrade: websocket'; V='Sec-WebSocket-Version: 13'; K='Sec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ=='
          curl -s -i --max-time 3 -H "$H" -H "$U" -H "$V" -H "$K" -H 'Origin: https://example.test' http://localhost:8081/ | head -1 | grep -q 101
          curl -s -i --max-time 3 -H "$H" -H "$U" -H "$V" -H "$K" -H 'Origin: https://evil.test' http://localhost:8081/ | head -1 | grep -q 400
      - name: Container logs
        if: failure()
        run: docker logs "$NAME-web"; docker logs "$NAME-ws"
      - name: Nettoyage
        if: always()
        run: |
          docker rm -f "$NAME-web" "$NAME-ws" >/dev/null 2>&1 || true
          docker volume rm -f "$VOL" >/dev/null 2>&1 || true
          docker rmi -f "$IMAGE" >/dev/null 2>&1 || true
